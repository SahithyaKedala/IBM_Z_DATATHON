apiVersion: v1
kind: Service
metadata:
  name: vectorvision-backend
  namespace: vectorvision
  labels:
    app: vectorvision
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: vectorvision
    tier: backend
---
apiVersion: v1
kind: Service
metadata:
  name: vectorvision-frontend
  namespace: vectorvision
  labels:
    app: vectorvision
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: vectorvision
    tier: frontend
